<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#glow)" stroke-width="4"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.4" filter="url(#blur)"/>
  <!-- Neural ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.6"/>
  <!-- Brain left hemisphere -->
  <path d="M 200 180 Q 160 200 155 256 Q 160 320 200 340 Q 230 350 256 340" 
        fill="none" stroke="url(#inner)" stroke-width="6" stroke-linecap="round"/>
  <!-- Brain right hemisphere -->
  <path d="M 312 180 Q 352 200 357 256 Q 352 320 312 340 Q 282 350 256 340" 
        fill="none" stroke="url(#inner)" stroke-width="6" stroke-linecap="round"/>
  <!-- Brain stem / connection -->
  <line x1="256" y1="340" x2="256" y2="380" stroke="url(#inner)" stroke-width="4" stroke-linecap="round"/>
  <!-- Left neural folds -->
  <path d="M 200 210 Q 180 240 195 270" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M 195 240 Q 175 260 190 290" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <!-- Right neural folds -->
  <path d="M 312 210 Q 332 240 317 270" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M 317 240 Q 337 260 322 290" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <!-- Central synapse nodes -->
  <circle cx="256" cy="220" r="5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="256" cy="260" r="6" fill="#7c3aed" opacity="0.9"/>
  <circle cx="256" cy="300" r="5" fill="#00e5ff" opacity="0.9"/>
  <!-- Cross connections -->
  <line x1="220" y1="220" x2="256" y2="220" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="292" y1="220" x2="256" y2="220" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <line x1="210" y1="260" x2="256" y2="260" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="302" y1="260" x2="256" y2="260" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="300" x2="256" y2="300" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="292" y1="300" x2="256" y2="300" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <!-- Orbital particles -->
  <circle cx="150" cy="180" r="3" fill="#00e5ff" opacity="0.6"/>
  <circle cx="362" cy="180" r="3" fill="#7c3aed" opacity="0.6"/>
  <circle cx="130" cy="300" r="2.5" fill="#00e5ff" opacity="0.4"/>
  <circle cx="382" cy="300" r="2.5" fill="#7c3aed" opacity="0.4"/>
  <circle cx="256" cy="130" r="3" fill="#00e5ff" opacity="0.5"/>
  <circle cx="256" cy="400" r="3" fill="#7c3aed" opacity="0.5"/>
</svg>
